name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: [self-hosted, ros-humble]
    steps:
      - name: Setup colcon workspace
        run: source /opt/ros/colcon/setup.bash

      - name: Check out repo
        uses: actions/checkout@v3
        with:
          path: src/bb_msgs

      - name: Install dependencies
        run: source /opt/ros/humble/setup.bash && rosdep update && rosdep install --from-paths src -i -r -y

      - name: Build
        run: source /opt/ros/humble/setup.bash && colcon build --merge-install --no-status
