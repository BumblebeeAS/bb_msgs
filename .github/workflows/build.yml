name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - humble

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Build and test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: humble
