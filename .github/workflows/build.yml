name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - humble

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/repo

      - name: Discover packages
        id: pkgs
        run: |
          names=$(colcon list --names-only --base-paths src/repo | tr '\n' ' ')
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "Found: $names"

      - name: Build and test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: humble
          package-name: ${{ steps.pkgs.outputs.names }}
